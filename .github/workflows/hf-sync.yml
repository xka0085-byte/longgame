name: hf-sync
# The pages site and the GitHub tree move daily; the Hugging Face dataset mirror
# did not, and a stale mirror is worse than no mirror because the card still
# claims to be a snapshot "from the upstream repository". Runs after the daily
# collection jobs and uploads the tree with the derived runs_index rebuilt first.
# Deliberately daily only: this job produces no data, it only copies what the
# collection jobs already wrote.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      force_card:
        description: "rewrite the dataset card even when no files changed"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: hf-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.27"
      - name: mirror to hugging face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          UPSTREAM_SHA: ${{ github.sha }}
          FORCE_CARD: ${{ inputs.force_card == true && '1' || '' }}
        run: python scripts/hf-sync.py

      # The index is rebuilt from data/lines/*.json, which the collection jobs
      # rewrite daily. Commit the rebuilt copy back so the repository and the
      # mirror never disagree about how many runs exist.
      - name: commit rebuilt index
        run: |
          git config user.name "longgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hf/runs_index.csv
          if git diff --cached --quiet; then echo "index already current"; exit 0; fi
          git commit -m "data(hf): rebuild runs_index $(date -u +%F) [skip ci]"
          BRANCH="${{ github.event.repository.default_branch }}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:refs/heads/$BRANCH"; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: notify failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notify-failure.mjs "${{ github.workflow }}"
