name: heartbeat

# 存在的理由：GitHub 的 schedule 会被静默丢弃。实测本项目 2026-10-22/23 各触发一次后，
# 到 10-30 之间 158 小时没有任何 schedule 运行，而原设计只有一个周一的 cron，
# 丢一次就是整周断档，且失败无声。
#
# 这里做两件事：
#   1. 保留一条每日 cron（原为一天三次，2026-11-13 降为一次）
#   2. 每次运行做自检 → 超期线当场补采 → critical 开 Issue → 落健康页
#
# 诚实的边界：cron 全被丢弃时，这个 workflow 自己也不会跑，仓库内部救不了自己。
# 真正的 dead-man 检查必须在仓库外部（见 docs/ops.html 的"外部触发器"一节）。

on:
  schedule:
    # 2026-11-13 降频：日 3 次 -> 日 1 次（UTC 02:00 = 北京 10:00）。
    # 原三次是为了对冲 GitHub schedule 静默丢触发；但丢触发是分钟级抖动，
    # 同一小时里排三次并不提高命中率，只是把 pages 重建与 issue 噪音乘了 3。
    # 保留一条并在 workflow_dispatch 上留手动补跑入口即可。
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    # 只在 master 上响应脚本改动。原来没写 branches，任何分支/tag 上改到这两个脚本
    # 都会触发一次心跳；而心跳会 checkout 那个 ref 再写回，遇到同名 tag 就必然被拒
    # （2026-11-05 archive/main-2026-11-05、11-06 snapshot-2026-11-05 两次变红）。
    # 脚本改动的自检只关心主干，没有理由在临时快照分支上跑。
    branches: [master]
    paths:
      - "scripts/heartbeat.mjs"
      - "scripts/lib/github-issue.mjs"
      - "scripts/resolve-failure.mjs"

permissions:
  contents: write
  issues: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl

      # 自检 + 自愈 + 告警。本身可能非零退出（有 critical），先不拦，让后面的
      # commit 把健康状态与 issue 落地，最后再由 verdict 步骤统一判定红绿。
      - name: health check + self-heal + alert
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/heartbeat.mjs

      - name: commit health state
        if: always()
        run: |
          git config user.name "longgame-bot"
          git config user.email "actions@users.noreply.github.com"
          # 写回目标固定为默认分支，不用 GITHUB_REF_NAME：tag 或临时分支触发时它取到的是
          # 那个 ref 名，push 会因为远端已有同名 tag 被直接拒绝（2026-11-05 / 11-06 两次
          # heartbeat 变红即此因，见 issue #5）。同时显式写 refs/heads/ 前缀，避免 git
          # 把裸分支名解析成同名 tag。
          BRANCH="${{ github.event.repository.default_branch }}"
          git add data/heartbeat.json data/collect-runs.json data/lines docs/health docs/health.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no health change to commit"
            exit 0
          fi
          git commit -m "heartbeat $(date -u +%FT%TZ)"
          # 心跳补采会与其他采集 workflow 同时写 data/lines，push 可能撞车。
          # 重试三次、每次先 rebase：宁可多试几次，也不要因为一次非快进把健康状态丢掉。
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:refs/heads/$BRANCH"; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: verdict (fail the run if still critical)
        run: |
          node -e '
            const fs=require("fs");
            const p="docs/health/latest.json";
            if(!fs.existsSync(p)){console.error("no health output");process.exit(1)}
            const d=JSON.parse(fs.readFileSync(p,"utf8"));
            console.log(`overall=${d.overall} critical=${d.signals.filter(s=>s.severity==="critical").length}`);
            for(const s of d.signals) console.log(`  [${s.severity}] ${s.id} — ${s.detail}`);
            process.exit(d.overall==="critical"?1:0);
          '

      - name: notify failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # critical 情况下 heartbeat 自己已经开了 longgame-critical Issue，这里再开一条
          # 只是噪声。噪声的代价是让人开始忽略 Issue——所以只在"脚本自己崩了、没来得及
          # 告警"时才补开 workflow-failed。
          if [ -f docs/health/latest.json ] && node -e '
            const d=require("./docs/health/latest.json");
            process.exit(d && d.overall==="critical" ? 0 : 1);
          '; then
            echo "critical already reported by heartbeat, skip duplicate issue"
          else
            node scripts/notify-failure.mjs "${{ github.workflow }}"
          fi

      # 恢复收口：整条 run 绿了就把之前登记的那条 workflow-failed 关掉，
      # 不让 issue 列表靠人记忆维护。
      - name: close stale failure issue
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/resolve-failure.mjs "${{ github.workflow }}"
