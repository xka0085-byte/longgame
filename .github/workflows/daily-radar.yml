name: daily-radar
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/run-all.mjs radar
      - run: node scripts/react.mjs
      - name: commit
        run: |
          git config user.name "longgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "radar $(date -u +%F)"
          git push
# indexed 2026-10-21
