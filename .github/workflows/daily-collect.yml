name: daily-collect
# 只在 portfolio.json 中带 window_until 的线（当前只有 sb253-docket）的窗口内实际采集；
# 窗口外 collect-daily 全部跳过，等同空跑。weekly 在窗口内会跳过该线，避免重复采集。
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - run: node scripts/run-all.mjs collect-daily
      # Watchdog: GitHub silently drops schedule events (this repo saw zero automatic runs
      # from 2026-10-22 to 10-29), so a single Monday cron is a single point of failure.
      # Check weekly cadence every day and top up on the spot when a line is overdue.
      - run: node scripts/if-stale.mjs
      - name: commit
        run: |
          git config user.name "longgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/ llms.txt
          git diff --cached --quiet || git commit -m "collect daily $(date -u +%F)"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: notify failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notify-failure.mjs "${{ github.workflow }}"
