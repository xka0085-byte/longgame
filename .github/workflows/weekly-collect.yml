name: weekly-collect
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - run: node scripts/run-all.mjs collect-weekly
      - name: assurance gate (blocks publish on failure)
        run: node scripts/assurance-gate.mjs
      - run: node scripts/publish.mjs
      - name: commit
        run: |
          git config user.name "longgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/ llms.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "collect weekly $(date -u +%F)"
          # 写回目标固定为默认分支，不用 GITHUB_REF_NAME：tag 或临时分支触发时它取到的是
          # 那个 ref 名，push 会因为远端已有同名 tag 被直接拒绝（2026-11-05 / 11-06 两次
          # heartbeat 变红即此因，见 issue #5）。同时显式写 refs/heads/ 前缀，避免 git
          # 把裸分支名解析成同名 tag。
          BRANCH="${{ github.event.repository.default_branch }}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:refs/heads/$BRANCH"; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: notify failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notify-failure.mjs "${{ github.workflow }}"
# indexed 2026-10-21
