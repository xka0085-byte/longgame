name: monthly-report
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - run: node scripts/run-all.mjs collect-monthly
      - run: node scripts/react.mjs
      - run: node scripts/self-audit.mjs
      - run: node scripts/report.mjs
      - run: node scripts/publish.mjs
      - name: commit
        run: |
          git config user.name "longgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/ llms.txt portfolio.json
          git diff --cached --quiet || git commit -m "monthly report $(date -u +%Y-%m)"
          git push
# indexed 2026-10-21
