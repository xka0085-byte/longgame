name: nightly-injection
# 每晚在沙箱副本里跑完整故障注入，把结果提交为 docs/assurance/fault-injection.md。
# 不使用 continue-on-error：注入未全部拦截即 job 失败，失败记录同样写入并提交。
on:
  schedule:
    - cron: "0 18 * * *"   # 02:00 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [master, assurance-phase2]
    paths:
      - assurance/fault-injection/**
      - .github/workflows/nightly-injection.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: nightly-injection
  cancel-in-progress: false

jobs:
  injection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: run full fault injection
        run: node assurance/fault-injection/nightly.mjs
      - name: commit result
        if: always()
        run: |
          git config user.name "longgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/assurance/fault-injection.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "nightly fault injection $(date -u +%Y-%m-%d)"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-injection-logs
          path: |
            docs/assurance/fault-injection.md
            assurance/fault-injection/logs/
            assurance/fault-injection/result.json
          if-no-files-found: warn

      - name: notify failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notify-failure.mjs "${{ github.workflow }}"
