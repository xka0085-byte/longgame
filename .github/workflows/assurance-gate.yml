name: assurance-gate
# Release hard gate: runs verify / contracts / fixtures / fault-injection in order.
# Any non-zero exit fails the job. publish.mjs verifies a gate result produced
# from the same commit and the same input fingerprint.
on:
  pull_request:
  push:
    branches: [main, assurance-phase1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: run assurance gate
        run: node scripts/assurance-gate.mjs
      - name: upload gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-gate-result
          path: |
            assurance/.gate/result.json
            assurance/fault-injection/guard-result.json
            assurance/fault-injection/logs/
          if-no-files-found: warn
