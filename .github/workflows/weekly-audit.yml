name: weekly-audit
# Audit-only weekly job. It does not collect data, does not touch
# portfolio.json, and does not change any data line. It only writes the
# audit status and the human-readable audit page.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/self-audit.mjs
      - name: commit audit
        run: |
          git config user.name "longgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status.json docs/audit/latest.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "audit $(date -u +%F)"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: notify failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notify-failure.mjs "${{ github.workflow }}"
