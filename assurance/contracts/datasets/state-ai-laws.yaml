contract_version: 1
id: "state-ai-laws"
status: "contract-only"
owner: "UNKNOWN"
scope:
  external: false
  local_path: "data/lines/state-ai-laws.json"
  record_selector: "collect.runs"
source:
  name: "MultiState state AI legislation tracker"
  hosts:
    - "www.multistate.ai"
  url: "https://www.multistate.ai/"
  access: "public"
  license: "UNKNOWN"
  license_note: "MultiState 页面的许可未在本阶段核验。"
schema:
  format: "json"
  required_fields:
    - path: "run.date"
      type: "string"
      unit: "UNKNOWN"
      note: "ISO-8601 尝试时间"
    - path: "page.id"
      type: "string"
      unit: "UNKNOWN"
      note: "页面标识"
    - path: "page.status"
      type: "integer"
      unit: "UNKNOWN"
      note: "HTTP 状态码"
    - path: "page.unavailable"
      type: "boolean"
      unit: "UNKNOWN"
      note: "不可用时必须为 true，且不得覆盖上一份有效数据"
    - path: "page.bytes"
      type: "integer"
      unit: "bytes"
      min: 0
  primary_key:
    - "run.date"
    - "page.id"
  dedupe:
    strategy: "run.date+page.id 唯一"
    basis: "line.mjs pages 分支"
  invariants:
    - id: "unavailable-keeps-previous"
      rule: "unavailable=true 的运行不得写入新的有效摘要或覆盖上一份有效数据"
      basis: "line.mjs 对 202/204/非 2xx/空正文分支的处理语义"
    - id: "status-and-unavailable-consistent"
      rule: "status 非 2xx 时 unavailable 必须为 true"
      basis: "HTTP 语义与 line.mjs 的 unavailable 判定"
    - id: "page-sig-for-valid"
      rule: "status 为 2xx 且 unavailable=false 时 sig 必须非空"
      basis: "line.mjs pages 分支"
units:
  - field: "page.bytes"
    unit: "bytes"
    basis: "Buffer.byteLength 的字节数"
  - field: "run.unavailablePages"
    unit: "count"
    basis: "页面条数"
freshness:
  cadence: "weekly"
  max_age_days: "UNKNOWN"
  basis: "UNKNOWN"
failure_policy:
  on_http_error: "fail"
  on_429: "fail"
  on_empty: "fail"
  on_parse_error: "fail"
  on_missing_field: "fail"
  on_unit_mismatch: "fail"
  on_duplicate: "fail"
  on_source_host_mismatch: "fail"
publish:
  require_gate: true
  blocked_by:
    - "verify"
    - "contracts"
    - "fixtures"
  external_data: false
review:
  last_reviewed: "2026-10-21"
  unresolved_assumptions:
    - "新鲜度上限未从来源文档或历史运行中证明，故标记 UNKNOWN，不设数值阈值。"
    - "来源许可条款未在本阶段核验，故标记 UNKNOWN。"
    - "本契约只覆盖字段与不变量，不证明来源内容的语义正确性。"
    - "州法清单的完整性未与本阶段之外的一手立法源逐一比对。"
