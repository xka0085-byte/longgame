contract_version: 1
assurance_level: 1
assurance_level_basis: "外部线由 mcpdoctor 托管，本仓库仅引用其状态，无本地原始数据与独立复算能力，按上限 1 记录。"
id: "erc8004-snapshot"
status: "external"
owner: "UNKNOWN"
scope:
  external: true
  local_path: "UNKNOWN"
  record_selector: "history[].chains"
source:
  name: "ERC-8004 identity registry counters via Blockscout"
  hosts:
    - "eth.blockscout.com"
    - "base.blockscout.com"
  url: "https://eth.blockscout.com/api/v2/tokens/0x8004A169FB4a3325136EB29fA0ceB6D2e539a432/counters"
  access: "public"
  license: "UNKNOWN"
  license_note: "Blockscout 实例的使用条款与数据许可未在本阶段核验。"
schema:
  format: "json"
  required_fields:
    - path: "record.date"
      type: "string"
      unit: "UNKNOWN"
      note: "YYYY-MM-DD"
    - path: "record.chains.ethereum.holders"
      type: "integer|null"
      unit: "count"
      min: 0
    - path: "record.chains.ethereum.transfers"
      type: "integer|null"
      unit: "count"
      min: 0
    - path: "record.chains.base.holders"
      type: "integer|null"
      unit: "count"
      min: 0
    - path: "record.chains.base.transfers"
      type: "integer|null"
      unit: "count"
      min: 0
  primary_key:
    - "record.date"
  dedupe:
    strategy: "日期唯一"
    basis: "脚本同日覆盖、否则追加"
  invariants:
    - id: "missing-counter-not-zero"
      rule: "API 缺字段或请求失败时必须为 null 并带 error，不得写 0"
      basis: "最高原则第五条；本阶段审计发现 ?? 0 缺陷"
    - id: "history-parse-failure-no-overwrite"
      rule: "历史 JSON 解析失败时不得用单条记录覆盖整个历史文件"
      basis: "本阶段审计发现 catch{} 后继续写盘的缺陷"
units:
  - field: "chains[].holders"
    unit: "count"
    basis: "Blockscout token_holders_count"
  - field: "chains[].transfers"
    unit: "count"
    basis: "Blockscout transfers_count"
freshness:
  cadence: "weekly"
  max_age_days: "UNKNOWN"
  basis: "外部线无本地采集与发布，longgame 无法独立证明新鲜度，故保持 UNKNOWN。"
failure_policy:
  on_http_error: "fail"
  on_429: "fail"
  on_empty: "fail"
  on_parse_error: "fail"
  on_missing_field: "fail"
  on_unit_mismatch: "fail"
  on_duplicate: "fail"
  on_source_host_mismatch: "fail"
  on_quarantine: "keep-previous"
publish:
  require_gate: true
  blocked_by:
    - "contracts"
    - "fixtures"
  external_data: true
  preconditions:
    - "同一 commit 的 assurance-gate 必须 PASS（verify / contracts / fixtures / fault-injection）"
    - "validate-contracts 零失败"
    - "本地线固定样本全部通过；外部线为 NOT_APPLICABLE"
    - "候选仅写入 assurance/.staging，全部校验通过后才原子替换 docs 与 data"
    - "provenance 必须写入 raw_sha256 / normalized_sha256 / validation_status / publication_status"
    - "外部线不本地发布；状态引用 mcpdoctor，缺证据时记 UNKNOWN"
review:
  last_reviewed: "2026-10-21"
  unresolved_assumptions:
    - "owner 未指定，责任人与升级路径为 UNKNOWN。"
    - "外部线没有本地原始数据与采集代码，新鲜度只能保持 UNKNOWN，不能由本仓库证明。"
    - "新鲜度上限由采集周期推导，来源文档未规定该数值，故阈值仅作为本仓库运维阈值，不声称来自来源本身。"
    - "来源许可条款未在本阶段核验，故标记 UNKNOWN。"
    - "本契约只覆盖字段与不变量，不证明来源内容的语义正确性。"
    - "该线由 mcpdoctor 管理；本阶段未运行其采集器，只做静态审计。"
    - "Blockscout 计数器可能滞后或误报，脚本注释已承认；未量化误差。"
