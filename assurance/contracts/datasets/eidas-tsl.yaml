contract_version: 1
assurance_level: 2
assurance_level_basis: "本仓库已具备契约、固定样本、发布门禁与故障注入，但尚无独立于本仓库的外部复算，按上限 2 记录。"
id: "eidas-tsl"
status: "contract-only"
owner: "UNKNOWN"
scope:
  external: false
  local_path: "data/lines/eidas-tsl.json"
  record_selector: "collect.runs"
source:
  name: "EU List of Trusted Lists (LOTL)"
  hosts:
    - "ec.europa.eu"
  url: "https://ec.europa.eu/tools/lotl/eu-lotl.xml"
  access: "public"
  license: "UNKNOWN"
  license_note: "EU LOTL 的再分发许可未在本阶段核验。"
schema:
  format: "json"
  required_fields:
    - path: "run.date"
      type: "string"
      unit: "UNKNOWN"
      note: "ISO-8601"
    - path: "run.pointers"
      type: "array"
      unit: "UNKNOWN"
      note: "去重后的 TSL 指针 URL"
    - path: "run.pointerCount"
      type: "integer"
      unit: "count"
      min: 0
  primary_key:
    - "run.date"
  dedupe:
    strategy: "run.date 唯一"
    basis: "line.mjs 每轮追加一条 run"
  invariants:
    - id: "pointercount-equals-unique-pointers"
      rule: "pointerCount 必须等于 run.pointers 去重后的长度"
      basis: "line.mjs lotl 分支"
    - id: "http-error-not-zero"
      rule: "HTTP 错误或非 XML 响应不得产生 pointerCount=0 并覆盖上一份有效指针"
      basis: "本阶段审计发现的缺陷；契约要求失败显式化"
units:
  - field: "run.pointerCount"
    unit: "count"
    basis: "指针 URL 条数"
freshness:
  cadence: "weekly"
  max_age_days: 10
  basis: "本仓库采集 cron 为 weekly；按 1.5 个采集周期设定上限，超过即视为过期，不以旧值冒充新鲜数据。"
failure_policy:
  on_http_error: "fail"
  on_429: "fail"
  on_empty: "fail"
  on_parse_error: "fail"
  on_missing_field: "fail"
  on_unit_mismatch: "fail"
  on_duplicate: "fail"
  on_source_host_mismatch: "fail"
  on_quarantine: "keep-previous"
publish:
  require_gate: true
  blocked_by:
    - "verify"
    - "contracts"
    - "fixtures"
  external_data: false
  preconditions:
    - "同一 commit 的 assurance-gate 必须 PASS（verify / contracts / fixtures / fault-injection）"
    - "validate-contracts 零失败"
    - "本地线固定样本全部通过；外部线为 NOT_APPLICABLE"
    - "候选仅写入 assurance/.staging，全部校验通过后才原子替换 docs 与 data"
    - "provenance 必须写入 raw_sha256 / normalized_sha256 / validation_status / publication_status"
review:
  last_reviewed: "2026-10-21"
  unresolved_assumptions:
    - "owner 未指定，责任人与升级路径为 UNKNOWN。"
    - "新鲜度上限由采集周期推导，来源文档未规定该数值，故阈值仅作为本仓库运维阈值，不声称来自来源本身。"
    - "来源许可条款未在本阶段核验，故标记 UNKNOWN。"
    - "本契约只覆盖字段与不变量，不证明来源内容的语义正确性。"
    - "line.mjs lotl 分支未检查 r.ok；错误页可能被解析成 0 个指针，契约与本阶段实现不一致。"
