contract_version: 1
assurance_level: 2
assurance_level_basis: "本仓库已具备契约、固定样本、发布门禁与故障注入，但尚无独立于本仓库的外部复算，按上限 2 记录。"
id: "triggers"
status: "contract-only"
owner: "UNKNOWN"
scope:
  external: false
  local_path: "data/lines/triggers.json"
  record_selector: "collect.runs"
source:
  name: "x402 / ColoPrice / Parametrix / Lloyd's / GovTrack trigger pages"
  hosts:
    - "www.x402.org"
    - "coloprice.com"
    - "www.parametrixinsurance.com"
    - "www.lloyds.com"
    - "www.govtrack.us"
  url: "https://www.x402.org/"
  access: "public"
  license: "UNKNOWN"
  license_note: "各触发页面的许可未在本阶段核验。"
schema:
  format: "json"
  required_fields:
    - path: "run.date"
      type: "string"
      unit: "UNKNOWN"
      note: "ISO-8601 尝试时间"
    - path: "page.id"
      type: "string"
      unit: "UNKNOWN"
      note: "页面标识"
    - path: "page.status"
      type: "integer"
      unit: "UNKNOWN"
      note: "HTTP 状态码"
    - path: "page.unavailable"
      type: "boolean"
      unit: "UNKNOWN"
      note: "不可用时必须为 true，且不得覆盖上一份有效数据"
    - path: "page.bytes"
      type: "integer"
      unit: "bytes"
      min: 0
    - path: "page.keywordHit"
      type: "boolean"
      unit: "UNKNOWN"
      note: "关键词命中只表示文本出现，不表示业务事件成立"
    - path: "page.changed"
      type: "boolean"
      unit: "UNKNOWN"
      note: "与上一轮有效抓取比较，布尔值"
    - path: "page.keywordHit"
      type: "boolean"
      unit: "UNKNOWN"
      note: "页面是否命中关键词，布尔值"
  primary_key:
    - "run.date"
    - "page.id"
  dedupe:
    strategy: "run.date+page.id 唯一"
    basis: "line.mjs pages 分支"
  invariants:
    - id: "page-flags-boolean"
      rule: "changed 与 keywordHit 必须为布尔值，不得用字符串或 0/1 替代"
      basis: "line.mjs 使用 !!changed 与 !!hit 写入，类型为 boolean"
    - id: "unavailable-keeps-previous"
      rule: "unavailable=true 的运行不得写入新的有效摘要或覆盖上一份有效数据"
      basis: "line.mjs 对 202/204/非 2xx/空正文分支的处理语义"
    - id: "status-and-unavailable-consistent"
      rule: "status 非 2xx 时 unavailable 必须为 true"
      basis: "HTTP 语义与 line.mjs 的 unavailable 判定"
    - id: "keyword-hit-not-event"
      rule: "keywordHit=true 不得直接发布为已发生事件"
      basis: "line.mjs 仅做正则命中，未做人或机构级核验"
units:
  - field: "page.bytes"
    unit: "bytes"
    basis: "Buffer.byteLength 的字节数"
  - field: "run.unavailablePages"
    unit: "count"
    basis: "页面条数"
freshness:
  cadence: "monthly"
  max_age_days: 40
  basis: "本仓库采集 cron 为 monthly；按 1.5 个采集周期设定上限，超过即视为过期，不以旧值冒充新鲜数据。"
failure_policy:
  on_http_error: "fail"
  on_429: "fail"
  on_empty: "fail"
  on_parse_error: "fail"
  on_missing_field: "fail"
  on_unit_mismatch: "fail"
  on_duplicate: "fail"
  on_source_host_mismatch: "fail"
  on_quarantine: "keep-previous"
publish:
  require_gate: true
  blocked_by:
    - "verify"
    - "contracts"
    - "fixtures"
  external_data: false
  preconditions:
    - "同一 commit 的 assurance-gate 必须 PASS（verify / contracts / fixtures / fault-injection）"
    - "validate-contracts 零失败"
    - "本地线固定样本全部通过；外部线为 NOT_APPLICABLE"
    - "候选仅写入 assurance/.staging，全部校验通过后才原子替换 docs 与 data"
    - "provenance 必须写入 raw_sha256 / normalized_sha256 / validation_status / publication_status"
review:
  last_reviewed: "2026-10-21"
  unresolved_assumptions:
    - "owner 未指定，责任人与升级路径为 UNKNOWN。"
    - "新鲜度上限由采集周期推导，来源文档未规定该数值，故阈值仅作为本仓库运维阈值，不声称来自来源本身。"
    - "来源许可条款未在本阶段核验，故标记 UNKNOWN。"
    - "本契约只覆盖字段与不变量，不证明来源内容的语义正确性。"
    - "关键词命中与真实业务触发之间的映射未证明，故该线不发布触发结论。"
